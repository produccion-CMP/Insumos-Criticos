<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMP Insumos</title>
  <style>
    /* Estilos minimalistas y de alto contraste para entorno industrial */
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .screen { display: none; max-width: 400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    h2 { text-align: center; margin-top: 0; color: #0056b3; }
    .btn { display: block; width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; transition: background 0.2s; }
    .btn-primary { background-color: #0056b3; color: white; }
    .btn-primary:active { background-color: #004494; }
    .btn-secondary { background-color: #e2e8f0; color: #333; }
    .btn-secondary:active { background-color: #cbd5e1; }
    .btn-success { background-color: #28a745; color: white; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    input[type="text"], input[type="password"], input[type="number"], input[type="date"] { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
    
    .hidden { display: none; }
    #loader { display: none; text-align: center; font-weight: bold; color: #0056b3; padding: 20px; }
    img.preview { max-width: 100%; height: auto; border-radius: 5px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>

  <div id="loader">Conectando con el servidor...</div>

  <!-- LOGIN -->
  <div id="s-login" class="screen active">
    <h2>Acceso</h2>
    <input type="password" id="pass" placeholder="Contraseña">
    <button class="btn btn-primary" onclick="login()">Ingresar</button>
  </div>

  <!-- MOVIMIENTO -->
  <div id="s-movimiento" class="screen">
    <h2>Tipo de Operación</h2>
    <button class="btn btn-secondary" onclick="setMovimiento('Ingreso')">📥 Ingreso</button>
    <button class="btn btn-secondary" onclick="setMovimiento('Envío')">📤 Envío</button>
  </div>

  <!-- INSUMO -->
  <div id="s-tipo" class="screen">
    <h2>Insumo</h2>
    <button class="btn btn-secondary" onclick="setTipo('Tarimas')">🟫 Tarimas</button>
    <button class="btn btn-secondary" onclick="setTipo('Stretch')">🌀 Stretch</button>
  </div>

  <!-- FOTO -->
  <div id="s-foto" class="screen">
    <h2>Evidencia</h2>
    <input type="file" id="inputFile" accept="image/*" capture="environment" style="display:none;" onchange="previewFile()">
    <button class="btn btn-secondary" onclick="document.getElementById('inputFile').click()">📸 Abrir Cámara / Galería</button>
    <img id="imgPreview" class="preview">
    <button class="btn btn-primary hidden" id="btnSiguienteFoto" onclick="validarFoto()">Continuar</button>
  </div>

  <!-- PROVEEDOR -->
  <div id="s-proveedor" class="screen">
    <h2>Proveedor</h2>
    <div id="provTarimasBtns" class="hidden">
      <button class="btn btn-secondary" onclick="setProv('Tucumán Pallet')">Tucumán Pallet</button>
      <button class="btn btn-secondary" onclick="setProv('Gianni')">Gianni</button>
      <button class="btn btn-secondary" onclick="mostrarOtroProv()">Otro...</button>
    </div>
    <div id="provStretchBtns" class="hidden">
      <button class="btn btn-secondary" onclick="setProv('Urflex')">Urflex</button>
      <button class="btn btn-secondary" onclick="mostrarOtroProv()">Otro...</button>
    </div>
    <div id="divOtroProv" class="hidden">
      <input type="text" id="inputOtroProv" placeholder="Escriba el proveedor">
      <button class="btn btn-primary" onclick="setProv(document.getElementById('inputOtroProv').value)">Aceptar</button>
    </div>
  </div>

  <!-- CANTIDAD -->
  <div id="s-cantidad" class="screen">
    <h2>Cantidad</h2>
    
    <!-- Botones rápidos solicitados para Tarimas -->
    <div id="botonesTarimas" class="grid-2 hidden">
      <button class="btn btn-secondary" onclick="setCant(500)">500</button>
      <button class="btn btn-secondary" onclick="setCant(600)">600</button>
      <button class="btn btn-secondary" onclick="setCant(1400)">1400</button>
      <button class="btn btn-secondary" onclick="mostrarManualCant()">Otro</button>
    </div>

    <!-- Entrada manual (para Stretch o para "Otro" en Tarimas) -->
    <div id="divCantManual" class="hidden">
      <input type="number" id="inputCant" placeholder="Cantidad (Kg o Unidades)">
      <input type="number" id="inputBobinas" class="hidden" placeholder="Cantidad Bobinas (Opcional)">
      <button class="btn btn-primary" onclick="guardarCantManual()">Continuar</button>
    </div>
  </div>

  <!-- REMITO Y FECHA -->
  <div id="s-detalles" class="screen">
    <h2>Detalles</h2>
    <input type="text" id="valRemito" placeholder="Nº Remito">
    <input type="date" id="valFecha">
    <input type="text" id="valObs" placeholder="Observaciones (Opcional)">
    <button class="btn btn-success" onclick="enviarDatos()">Guardar Registro</button>
  </div>

  <script>
    // ⚠️ REEMPLAZAR POR LA URL DE APPS SCRIPT
    const API_URL = "AQUI_LA_URL_DE_TU_WEB_APP"; 

    let db = { 
      password: '', movimiento: '', tipo: '', proveedor: '', cantidad: '', 
      cantBobinas: '', fotoBase64: '', fileName: '', remito: '', fecha: '', obs: '' 
    };

    function nav(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function toggleLoader(show) {
      document.getElementById('loader').style.display = show ? 'block' : 'none';
    }

    // 1. LOGIN
    function login() {
      const p = document.getElementById('pass').value;
      if (p === 'GMP2026') { db.password = p; nav('s-movimiento'); } 
      else { alert('Contraseña incorrecta'); }
    }

    // 2. MOVIMIENTO
    function setMovimiento(val) {
      db.movimiento = val;
      nav('s-tipo');
    }

    // 3. TIPO
    function setTipo(val) {
      db.tipo = val;
      if (db.movimiento === 'Envío') {
        db.proveedor = 'Envío';
        nav('s-foto');
      } else {
        nav('s-foto');
      }
    }

    // 4. FOTO
    function previewFile() {
      const file = document.getElementById('inputFile').files[0];
      if(!file) return;
      db.fileName = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        db.fotoBase64 = e.target.result;
        document.getElementById('imgPreview').src = db.fotoBase64;
        document.getElementById('imgPreview').style.display = 'block';
        document.getElementById('btnSiguienteFoto').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function validarFoto() {
      if(!db.fotoBase64) return alert('La foto es obligatoria');
      if (db.movimiento === 'Envío') armarCantidad();
      else armarProveedor();
    }

    // 5. PROVEEDOR
    function armarProveedor() {
      document.getElementById('provTarimasBtns').classList.add('hidden');
      document.getElementById('provStretchBtns').classList.add('hidden');
      document.getElementById('divOtroProv').classList.add('hidden');
      
      if(db.tipo === 'Tarimas') document.getElementById('provTarimasBtns').classList.remove('hidden');
      else document.getElementById('provStretchBtns').classList.remove('hidden');
      nav('s-proveedor');
    }

    function mostrarOtroProv() {
      document.getElementById('divOtroProv').classList.remove('hidden');
    }

    function setProv(val) {
      if(!val) return;
      db.proveedor = val;
      armarCantidad();
    }

    // 6. CANTIDAD
    function armarCantidad() {
      document.getElementById('botonesTarimas').classList.add('hidden');
      document.getElementById('divCantManual').classList.add('hidden');
      document.getElementById('inputBobinas').classList.add('hidden');

      if (db.tipo === 'Tarimas') {
        document.getElementById('botonesTarimas').classList.remove('hidden');
      } else {
        document.getElementById('divCantManual').classList.remove('hidden');
        document.getElementById('inputBobinas').classList.remove('hidden');
      }
      nav('s-cantidad');
    }

    function mostrarManualCant() {
      document.getElementById('divCantManual').classList.remove('hidden');
    }

    function setCant(val) { // Para los botones de 500, 600, 1400
      db.cantidad = val;
      prepararDetalles();
    }

    function guardarCantManual() {
      const c = document.getElementById('inputCant').value;
      if(!c || c <= 0) return alert('Ingrese una cantidad válida');
      db.cantidad = c;
      if(db.tipo === 'Stretch') db.cantBobinas = document.getElementById('inputBobinas').value;
      prepararDetalles();
    }

    // 7. DETALLES
    function prepararDetalles() {
      document.getElementById('valFecha').valueAsDate = new Date();
      nav('s-detalles');
    }

    // 8. ENVÍO AL BACKEND MEDIANTE FETCH
    function enviarDatos() {
      db.remito = document.getElementById('valRemito').value.trim();
      db.fecha = document.getElementById('valFecha').value;
      db.obs = document.getElementById('valObs').value.trim();

      if(!db.remito) return alert('Ingrese Nº de remito');
      
      toggleLoader(true);
      
      // La solicitud POST desde GitHub hacia Apps Script (bypass de CORS usando text/plain implícito)
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "procesarCarga", payload: db })
      })
      .then(response => response.json())
      .then(data => {
        toggleLoader(false);
        if (data.exito) {
          alert('¡Registro exitoso!');
          location.reload(); // Reinicia la app para el siguiente registro
        } else {
          alert('Error: ' + data.mensaje);
        }
      })
      .catch(error => {
        toggleLoader(false);
        alert('Error de conexión con el servidor.');
        console.error(error);
      });
    }
  </script>
</body>
</html>
