<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sistema Logístico GMP</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #1d4ed8; --surface: #ffffff; --background: #f1f5f9;
      --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
      --success: #16a34a; --radius: 12px;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--background); color: var(--text); margin: 0; padding: 20px; }
    
    .container { max-width: 450px; margin: 0 auto; min-height: 90vh; display: flex; flex-direction: column; justify-content: center; }
    
    .header { display: flex; align-items: center; margin-bottom: 20px; }
    .btn-back { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); padding: 5px 15px 5px 0; }
    .header h2 { margin: 0; font-size: 1.4rem; color: var(--text); }

    .screen { display: none; background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    .screen.active { display: block; animation: slideIn 0.2s ease-out; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; margin-bottom: 12px; border: none; border-radius: var(--radius); font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.1s; background: var(--background); color: var(--text); border: 1px solid var(--border); }
    .btn:active { background: #e2e8f0; }
    .btn-primary { background: var(--primary); color: white; border: none; }
    .btn-primary:active { background: #1e40af; }
    .btn-success { background: var(--success); color: white; border: none; margin-top: 15px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    
    input, select { width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 1rem; box-sizing: border-box; background: var(--background); outline: none; }
    input:focus, select:focus { border-color: var(--primary); }

    .hidden { display: none !important; }
    #preview-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: var(--radius); margin-bottom: 15px; border: 1px solid var(--border); }
    
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; font-weight: 600; color: var(--primary); }
    .spinner { border: 4px solid var(--border); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader" class="hidden">
    <div class="spinner"></div>
    <span>Consultando Base de Datos...</span>
  </div>

  <div class="container">
    
    <!-- HEADER DINÁMICO -->
    <div class="header hidden" id="appHeader">
      <button class="btn-back" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
      <h2 id="screenTitle">Título</h2>
    </div>

    <!-- 1. LOGIN -->
    <div id="s-login" class="screen active">
      <h2 style="text-align: center; margin-bottom: 20px;">Control de Acceso</h2>
      <input type="password" id="pass" placeholder="Ingresar contraseña" style="text-align: center; letter-spacing: 2px;">
      <button class="btn btn-primary" onclick="login()">Ingresar</button>
    </div>

    <!-- 2. MOVIMIENTO -->
    <div id="s-movimiento" class="screen">
      <button class="btn" onclick="setMovimiento('Ingreso')"><i class="fa-solid fa-arrow-down-to-bracket"></i> Registrar Ingreso</button>
      <button class="btn" onclick="setMovimiento('Envío')"><i class="fa-solid fa-truck-fast"></i> Registrar Envío</button>
    </div>

    <!-- 3. TIPO INSUMO -->
    <div id="s-tipo" class="screen">
      <button class="btn" onclick="loadProveedores('Tarimas')"><i class="fa-solid fa-pallet" style="color: #8b5cf6;"></i> Tarimas</button>
      <button class="btn" onclick="loadProveedores('Stretch')"><i class="fa-solid fa-box-open" style="color: #06b6d4;"></i> Film Stretch</button>
    </div>

    <!-- 4. PROVEEDOR -->
    <div id="s-proveedor" class="screen">
      <div id="dynamicProvBtns"></div>
      
      <!-- Lógica especial Tucumán/Chivilisco -->
      <button class="btn hidden" id="btnTucChiv" onclick="showSubTucChiv()">Tucumán Pallet / Chivilisco</button>
      <div id="subTucChiv" class="hidden" style="margin-left: 20px; border-left: 2px solid var(--primary); padding-left: 10px;">
        <button class="btn" onclick="selectProv('Tucumán Pallet', 'Tucumán Pallet')">Tucumán Pallet</button>
        <button class="btn" onclick="selectProv('Tucumán Pallet', 'Chivilisco')">Chivilisco</button>
      </div>

      <button class="btn" onclick="document.getElementById('divOtroProv').classList.remove('hidden')"><i class="fa-solid fa-list"></i> Otros</button>
      <div id="divOtroProv" class="hidden" style="margin-top: 15px;">
        <select id="selectOtroProv"></select>
        <button class="btn btn-primary" onclick="selectOtroProv()"><i class="fa-solid fa-check"></i> Confirmar Selección</button>
      </div>
    </div>

    <!-- 5. CANTIDAD -->
    <div id="s-cantidad" class="screen">
      <div class="grid-2" id="dynamicCantBtns"></div>

      <button class="btn" onclick="document.getElementById('divCantManual').classList.remove('hidden')"><i class="fa-solid fa-keyboard"></i> Ingreso Manual</button>
      
      <div id="divCantManual" class="hidden" style="margin-top: 15px;">
        <input type="number" id="inputCant" placeholder="Cantidad (Unidades/Kg)" inputmode="decimal">
        <input type="number" id="inputBobinas" class="hidden" placeholder="Cantidad Bobinas" inputmode="decimal">
        <button class="btn btn-primary" onclick="guardarCantManual()">Confirmar Cantidad</button>
      </div>
    </div>

    <!-- 6. FOTO -->
    <div id="s-foto" class="screen">
      <input type="file" id="inputFile" accept="image/*" capture="environment" class="hidden" onchange="previewFile()">
      <button class="btn" onclick="document.getElementById('inputFile').click()"><i class="fa-solid fa-camera"></i> Tomar Fotografía</button>
      <img id="imgPreview" class="hidden">
      
      <button class="btn btn-primary hidden" id="btnOkFoto" onclick="nav('s-detalles', 'Detalles Finales')"><i class="fa-solid fa-check"></i> Utilizar Foto</button>
      <button class="btn" id="btnOmitirFoto" onclick="omitirFoto()">Omitir Evidencia</button>
    </div>

    <!-- 7. DETALLES -->
    <div id="s-detalles" class="screen">
      <label style="font-size: 0.9rem; font-weight: 600;">Nº de Remito</label>
      <input type="text" id="valRemito">
      
      <label style="font-size: 0.9rem; font-weight: 600;">Fecha Operación</label>
      <input type="date" id="valFecha">
      
      <label style="font-size: 0.9rem; font-weight: 600;">Observaciones</label>
      <input type="text" id="valObs">
      
      <button class="btn btn-success" onclick="enviarDatos()"><i class="fa-solid fa-cloud-arrow-up"></i> Registrar Movimiento</button>
    </div>

  </div>

  <script>
    // ⚠️ REEMPLAZAR POR LA URL DE APPS SCRIPT
    const API_URL = "AQUI_LA_URL_DE_TU_WEB_APP";

    let db = { password: '', movimiento: '', tipo: '', proveedor: '', proveedorBusqueda: '', cantidad: '', cantBobinas: '', fotoBase64: '', fileName: '', remito: '', fecha: '', obs: '' };
    let historyStack = [];

    // Lógica ENTER Login
    document.getElementById('pass').addEventListener('keypress', function(e) { if (e.key === 'Enter') login(); });

    function toggleLoader(state) { document.getElementById('loader').classList.toggle('hidden', !state); }

    function nav(id, title) {
      if (historyStack.length > 0) document.getElementById(historyStack[historyStack.length - 1].id).classList.remove('active');
      historyStack.push({ id: id, title: title });
      renderScreen();
    }

    function goBack() {
      if (historyStack.length <= 1) return;
      document.getElementById(historyStack.pop().id).classList.remove('active');
      renderScreen();
    }

    function renderScreen() {
      const current = historyStack[historyStack.length - 1];
      document.getElementById(current.id).classList.add('active');
      if (current.id === 's-login') {
        document.getElementById('appHeader').classList.add('hidden');
      } else {
        document.getElementById('appHeader').classList.remove('hidden');
        document.getElementById('screenTitle').innerText = current.title;
      }
    }

    // Inicialización
    historyStack.push({ id: 's-login', title: '' });

    function login() {
      if (document.getElementById('pass').value === 'GMP2026') {
        db.password = 'GMP2026';
        nav('s-movimiento', 'Tipo de Operación');
      } else {
        alert('Credenciales denegadas.');
      }
    }

    function setMovimiento(val) {
      db.movimiento = val;
      nav('s-tipo', 'Insumo');
    }

    function loadProveedores(tipo) {
      db.tipo = tipo;
      if (db.movimiento === 'Envío') {
        db.proveedor = 'Envío';
        db.proveedorBusqueda = 'Envío';
        return extractStats();
      }

      toggleLoader(true);
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "getProveedores", tipo: tipo }) })
      .then(r => r.json())
      .then(data => {
        toggleLoader(false);
        if (!data.exito) return alert("Error backend: " + data.mensaje);
        
        const container = document.getElementById('dynamicProvBtns');
        container.innerHTML = '';
        data.top.forEach(p => {
          container.innerHTML += `<button class="btn" onclick="selectProv('${p}', '${p}')">${p}</button>`;
        });

        document.getElementById('btnTucChiv').classList.toggle('hidden', tipo !== 'Tarimas');
        document.getElementById('subTucChiv').classList.add('hidden');
        document.getElementById('divOtroProv').classList.add('hidden');

        const select = document.getElementById('selectOtroProv');
        select.innerHTML = '<option value="">Seleccionar...</option>';
        data.todos.forEach(p => {
          if (!data.top.includes(p) && p !== 'Tucumán Pallet' && p !== 'Chivilisco') {
            select.innerHTML += `<option value="${p}">${p}</option>`;
          }
        });

        nav('s-proveedor', 'Proveedor');
      }).catch(() => { toggleLoader(false); alert("Fallo de red."); });
    }

    function showSubTucChiv() {
      document.getElementById('subTucChiv').classList.remove('hidden');
    }

    function selectOtroProv() {
      const val = document.getElementById('selectOtroProv').value;
      if (!val) return;
      selectProv(val, val);
    }

    function selectProv(registro, busqueda) {
      db.proveedor = registro;
      db.proveedorBusqueda = busqueda;
      extractStats();
    }

    function extractStats() {
      toggleLoader(true);
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "getStats", tipo: db.tipo, proveedorBusqueda: db.proveedorBusqueda }) })
      .then(r => r.json())
      .then(data => {
        toggleLoader(false);
        if (!data.exito) return alert("Error backend: " + data.mensaje);

        const container = document.getElementById('dynamicCantBtns');
        container.innerHTML = '';
        data.cantidades.forEach(c => {
          container.innerHTML += `<button class="btn" onclick="setCant(${c})">${c}</button>`;
        });

        document.getElementById('valRemito').value = data.remito;
        document.getElementById('inputBobinas').classList.toggle('hidden', db.tipo === 'Tarimas');
        document.getElementById('divCantManual').classList.add('hidden');

        nav('s-cantidad', 'Cantidad');
      }).catch(() => { toggleLoader(false); alert("Fallo de red."); });
    }

    function setCant(val) {
      db.cantidad = val;
      nav('s-foto', 'Evidencia');
    }

    function guardarCantManual() {
      const c = document.getElementById('inputCant').value;
      if (!c || c <= 0) return alert('Valor numérico inválido.');
      db.cantidad = c;
      if (db.tipo === 'Stretch') db.cantBobinas = document.getElementById('inputBobinas').value;
      nav('s-foto', 'Evidencia');
    }

    function previewFile() {
      const file = document.getElementById('inputFile').files[0];
      if (!file) return;
      db.fileName = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        db.fotoBase64 = e.target.result;
        document.getElementById('imgPreview').src = db.fotoBase64;
        document.getElementById('imgPreview').classList.remove('hidden');
        document.getElementById('btnOkFoto').classList.remove('hidden');
        document.getElementById('btnOmitirFoto').classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    function omitirFoto() {
      db.fotoBase64 = "";
      document.getElementById('valFecha').valueAsDate = new Date();
      nav('s-detalles', 'Detalles Finales');
    }

    function enviarDatos() {
      db.remito = document.getElementById('valRemito').value.trim();
      db.fecha = document.getElementById('valFecha').value;
      db.obs = document.getElementById('valObs').value.trim();

      if (!db.remito) return alert('Atributo requerido: Nº Remito.');
      
      toggleLoader(true);
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "procesarCarga", payload: db }) })
      .then(r => r.json())
      .then(data => {
        toggleLoader(false);
        if (data.exito) { alert('Transacción registrada.'); location.reload(); }
        else { alert('Error: ' + data.mensaje); }
      }).catch(() => { toggleLoader(false); alert('Fallo de red.'); });
    }
  </script>
</body>
</html>
