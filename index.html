<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#d96b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Insumos Críticos · CEVIL</title>
  <link rel="icon" href="img/logo-cmp.png">
  <link rel="apple-touch-icon" href="img/logo-cmp.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('ic_tema') || 'null');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="config.js" defer></script>
  <script src="datos.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="splash">
    <span class="logo-tile"><img src="img/logo-cmp.png" alt=""></span>
    <div class="orbita" aria-hidden="true"><span>🪵</span><span>🧻</span><span>⛽</span><span>🪣</span></div>
    <h2>Insumos Críticos</h2>
    <p id="splashTxt">Contando tarimas…</p>
    <div class="barra"><span></span></div>
  </div>
  <div id="toploader"><span></span></div>

  <header class="top">
    <a class="brand" href="#/resumen">
      <span class="logo-tile"><img src="img/logo-cmp.png" alt=""></span>
      <div>Insumos Críticos<small>Tarimas · Stretch · Gasoil · Cal</small></div>
    </a>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="top-right">
      <div class="reloj" id="reloj" title="Turno actual">
        <b id="relojHora">--:--</b>
        <div><span class="turno" id="relojTurno">T-</span><small id="relojRango"></small><i><span id="relojAvance"></span></i></div>
      </div>
      <span class="estado-red" id="red"><i></i><span>Conectando</span></span>
      <button class="btn ghost icon" id="btnRefrescar" title="Actualizar datos" aria-label="Actualizar datos">🔄</button>
      <button class="btn ghost icon" id="btnTema" title="Cambiar tema claro u oscuro" aria-label="Cambiar tema">🌙</button>
    </div>
  </header>

  <main id="app"></main>
  <nav class="bottom-nav" id="bnav" aria-label="Secciones"></nav>
  <div id="toasts" aria-live="polite"></div>

  <dialog id="dlg">
    <form method="dialog">
      <div class="dlg-ico">🗑️</div>
      <p id="dlgTexto"></p>
      <div class="acciones">
        <button class="btn" value="no">Cancelar</button>
        <button class="btn pri dan-pri" value="si">Confirmar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
